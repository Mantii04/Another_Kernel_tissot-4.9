name: Build Tissot Treble Kernel + KSU-Next + memkernel

on:
  push:
    branches: [ "Treble-Non-KSU" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc bison flex libncurses-dev libssl-dev libelf-dev python3 git zip lld

    - name: Clone Proton Clang
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git ../clang

    - name: Fix Bluetooth includes
      run: |
        find drivers/bluetooth -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i \
          -e 's/<btfm_slim\.h>/"btfm_slim.h"/g' \
          -e 's/<btfm_slim_wcn3990\.h>/"btfm_slim_wcn3990.h"/g' \
          -e 's/<btfm_slim_codec\.h>/"btfm_slim_codec.h"/g' {} +

    - name: Integrate KernelSU-Next v3.2.0 with Kprobes
      run: |
        rm -rf drivers/staging/kernelsu
        sed -i '/kernelsu/d' drivers/staging/Kconfig
        sed -i '/kernelsu/d' drivers/staging/Makefile
        
        # Use v3.2.0 tag (NOT next/v3.3.0 which uses compiler_types.h)
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/v3.2.0/kernel/setup.sh" | bash -s v3.2.0
        
        # Fix: Define syscall_fn_t for 4.9 kernel
        sed -i '1i typedef void (*syscall_fn_t)(void);' drivers/kernelsu/hook/syscall_hook.h

    - name: Configure kernel
      run: |
        export PATH="../clang/bin:$PATH"
        mkdir -p out
        make O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- tissot_defconfig
        ./scripts/config --file out/.config \
          --enable MODULES \
          --enable MODULE_UNLOAD \
          --enable KALLSYMS \
          --enable KALLSYMS_ALL \
          --disable MODVERSIONS \
          --module MEMKERNEL \
          --enable OVERLAY_FS \
          --enable KPROBES \
          --enable KPROBE_EVENTS \
          --enable KSU_KPROBE_HOOKS \
          --set-val KSU y
        make O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- olddefconfig
        
        echo "=== FINAL CONFIG CHECK ==="
        grep -E "^CONFIG_KSU=|^CONFIG_KPROBES=|^CONFIG_KPROBE_EVENTS=|^CONFIG_KSU_KPROBE_HOOKS=|^CONFIG_OVERLAY_FS=|^CONFIG_MEMKERNEL=|^CONFIG_MODULES=|^CONFIG_MODVERSIONS=" out/.config

    - name: Build vmlinux, modules, and Image.gz-dtb
      run: |
        export PATH="../clang/bin:$PATH"
        set -o pipefail
        make -j$(nproc) \
          O=out \
          ARCH=arm64 \
          CC=clang \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          LD=../clang/bin/ld.lld \
          AR=../clang/bin/llvm-ar \
          NM=../clang/bin/llvm-nm \
          OBJCOPY=../clang/bin/llvm-objcopy \
          OBJDUMP=../clang/bin/llvm-objdump \
          STRIP=../clang/bin/llvm-strip \
          KCFLAGS="-Wno-error=implicit-function-declaration -Wno-error=strict-prototypes -Wno-error=incompatible-pointer-types -Wno-error=address-of-packed-member" \
          vmlinux modules Image.gz-dtb 2>&1 | tee kernel_build.log
        ls -la out/arch/arm64/boot/Image.gz-dtb
        ls -la out/drivers/memkernel/*.ko

    - name: Upload kernel image
      uses: actions/upload-artifact@v4
      with:
        name: Image-gz-dtb
        path: out/arch/arm64/boot/Image.gz-dtb
        if-no-files-found: error
        retention-days: 30

    - name: Upload memkernel module
      uses: actions/upload-artifact@v4
      with:
        name: memkernel-module
        path: out/drivers/memkernel/*.ko
        if-no-files-found: error
        retention-days: 30

    - name: Upload build logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: kernel_build.log
        if-no-files-found: warn
        retention-days: 7
