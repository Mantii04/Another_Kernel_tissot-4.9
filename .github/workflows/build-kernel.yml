name: Build Stable Treble + KSU-Next + Official SuSFS + memkernel (Clang)

on:
  push:
    branches: [ "Treble-Non-KSU" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Install dependencies and GCC 10 (for binutils)
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc bison flex libncurses-dev libssl-dev libelf-dev python3 git zip lld wget
        sudo apt-get install -y gcc-10-aarch64-linux-gnu g++-10-aarch64-linux-gnu
        sudo ln -sf /usr/bin/aarch64-linux-gnu-gcc-10 /usr/bin/aarch64-linux-gnu-gcc
        sudo ln -sf /usr/bin/aarch64-linux-gnu-g++-10 /usr/bin/aarch64-linux-gnu-g++
        sudo ln -sf /usr/bin/aarch64-linux-gnu-gcc-ar-10 /usr/bin/aarch64-linux-gnu-gcc-ar
        sudo ln -sf /usr/bin/aarch64-linux-gnu-gcc-nm-10 /usr/bin/aarch64-linux-gnu-gcc-nm
        sudo apt-get install -y gcc-10-arm-linux-gnueabi g++-10-arm-linux-gnueabi
        sudo ln -sf /usr/bin/arm-linux-gnueabi-gcc-10 /usr/bin/arm-linux-gnueabi-gcc
        sudo ln -sf /usr/bin/arm-linux-gnueabi-g++-10 /usr/bin/arm-linux-gnueabi-g++
        sudo ln -sf /usr/bin/arm-linux-gnueabi-gcc-ar-10 /usr/bin/arm-linux-gnueabi-gcc-ar
        sudo ln -sf /usr/bin/arm-linux-gnueabi-gcc-nm-10 /usr/bin/arm-linux-gnueabi-gcc-nm

    - name: Clone Proton Clang
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git ../clang

    - name: Fix Bluetooth, SELinux, and CPU Input Boost
      run: |
        find drivers/bluetooth -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i \
          -e 's/<btfm_slim\.h>/"btfm_slim.h"/g' \
          -e 's/<btfm_slim_wcn3990\.h>/"btfm_slim_wcn3990.h"/g' \
          -e 's/<btfm_slim_codec\.h>/"btfm_slim_codec.h"/g' {} +
        sed -i 's/char selinux_enforcing = 1;/char selinux_enforcing = 0;/g' security/selinux/hooks.c
        sed -i '1i #ifndef stune_boost\n#define stune_boost do_stune_boost\n#endif' drivers/cpufreq/cpu_input_boost.c

    - name: Integrate KernelSU-Next (legacy) and apply manual hooks
      run: |
        rm -rf drivers/staging/kernelsu
        sed -i '/kernelsu/d' drivers/staging/Kconfig
        sed -i '/kernelsu/d' drivers/staging/Makefile
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
        sed -i '/depends on KPROBES/d' KernelSU-Next/kernel/Kconfig
        python3 patch_ksu_next.py
        echo "CONFIG_KSU=y" >> arch/arm64/configs/tissot_defconfig

    - name: Apply Official SuSFS patches
      run: |
        # 1. Download official SuSFS kernel patch and fix variable name
        wget -qO susfs.patch "https://gitlab.com/simonpunk/susfs4ksu/-/raw/kernel-4.9/kernel_patches/50_add_susfs_in_kernel-4.9.patch"
        sed -i 's/saved_command_line/new_command_line/g' susfs.patch
        patch -p1 --forward --batch --fuzz=5 < susfs.patch || true
        
        # 2. Download official SuSFS source files
        wget -qO fs/susfs.c "https://gitlab.com/simonpunk/susfs4ksu/-/raw/kernel-4.9/kernel_patches/fs/susfs.c"
        wget -qO include/linux/susfs.h "https://gitlab.com/simonpunk/susfs4ksu/-/raw/kernel-4.9/kernel_patches/include/linux/susfs.h"
        wget -qO include/linux/susfs_def.h "https://gitlab.com/simonpunk/susfs4ksu/-/raw/kernel-4.9/kernel_patches/include/linux/susfs_def.h"
        
        # 3. Download and fix the SuSFS KSU patch (rename functions to match KernelSU-Next)
        python3 fix_susfs_ksu_patch.py
        
        # 4. Apply the fixed SuSFS KSU patch from the root
        patch -p1 --forward --batch --fuzz=5 < 10_enable_susfs_for_ksu.patch || true
        
        echo "=== SuSFS patches applied! ==="

    - name: Configure kernel
      run: |
        export PATH="../clang/bin:$PATH"
        mkdir -p out
        make O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- tissot_defconfig
        ./scripts/config --file out/.config \
          --enable MODULES \
          --enable MODULE_UNLOAD \
          --enable KALLSYMS \
          --enable KALLSYMS_ALL \
          --disable MODVERSIONS \
          --module MEMKERNEL \
          --enable OVERLAY_FS \
          --set-val KSU y \
          --enable THREAD_INFO_IN_TASK \
          --enable KSU_SUSFS \
          --enable KSU_SUSFS_SUS_PATH \
          --enable KSU_SUSFS_SUS_MOUNT \
          --enable KSU_SUSFS_SUS_KSTAT \
          --enable KSU_SUSFS_SPOOF_UNAME \
          --enable KSU_SUSFS_ENABLE_LOG \
          --enable KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
          --enable KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
          --enable KSU_SUSFS_TRY_UMOUNT \
          --enable KSU_SUSFS_OPEN_REDIRECT \
          --enable KSU_SUSFS_SUS_MAP \
          --enable KSU_SUSFS_SUS_OVERLAYFS \
          --enable KSU_SUSFS_HAS_MAGIC_MOUNT \
          --enable KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
          --enable KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
          --enable KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT \
          --enable CPU_INPUT_BOOST \
          --disable CC_STACKPROTECTOR_STRONG \
          --disable CC_STACKPROTECTOR
        make O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- olddefconfig

        echo "=== FINAL CONFIG CHECK ==="
        grep -E "CONFIG_KSU|CONFIG_KPROBES|CONFIG_OVERLAY_FS|CONFIG_MEMKERNEL|CONFIG_MODULES|CONFIG_MODVERSIONS|CONFIG_CPU_INPUT_BOOST" out/.config

    - name: Build vmlinux, modules, and Image.gz-dtb
      run: |
        export PATH="../clang/bin:$PATH"
        set -o pipefail
        make -j$(nproc) \
          O=out \
          ARCH=arm64 \
          CC=clang \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          KCFLAGS="-gdwarf-4 -Wno-error=implicit-function-declaration -Wno-error=strict-prototypes -Wno-error=incompatible-pointer-types -Wno-error=address-of-packed-member" \
          vmlinux modules Image.gz-dtb 2>&1 | tee kernel_build.log
        ls -la out/arch/arm64/boot/Image.gz-dtb
        ls -la out/drivers/memkernel/*.ko

    - name: Upload kernel image
      uses: actions/upload-artifact@v4
      with:
        name: Image-gz-dtb
        path: out/arch/arm64/boot/Image.gz-dtb
        if-no-files-found: error
        retention-days: 30

    - name: Upload memkernel module
      uses: actions/upload-artifact@v4
      with:
        name: memkernel-module
        path: out/drivers/memkernel/*.ko
        if-no-files-found: error
        retention-days: 30

    - name: Upload build logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: kernel_build.log
        if-no-files-found: warn
        retention-days: 7
