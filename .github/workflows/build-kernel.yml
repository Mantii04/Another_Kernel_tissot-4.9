name: Build Tissot OC-Treble Kernel + KSU-Next + memkernel

on:
  push:
    branches: [ "OC-Treble" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Install dependencies and GCC 10
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc bison flex libncurses-dev libssl-dev libelf-dev python3 git zip
        sudo apt-get install -y gcc-10-aarch64-linux-gnu g++-10-aarch64-linux-gnu
        sudo ln -sf /usr/bin/aarch64-linux-gnu-gcc-10 /usr/bin/aarch64-linux-gnu-gcc
        sudo ln -sf /usr/bin/aarch64-linux-gnu-g++-10 /usr/bin/aarch64-linux-gnu-g++
        sudo ln -sf /usr/bin/aarch64-linux-gnu-gcc-ar-10 /usr/bin/aarch64-linux-gnu-gcc-ar
        sudo ln -sf /usr/bin/aarch64-linux-gnu-gcc-nm-10 /usr/bin/aarch64-linux-gnu-gcc-nm
        sudo apt-get install -y gcc-10-arm-linux-gnueabi g++-10-arm-linux-gnueabi
        sudo ln -sf /usr/bin/arm-linux-gnueabi-gcc-10 /usr/bin/arm-linux-gnueabi-gcc
        sudo ln -sf /usr/bin/arm-linux-gnueabi-g++-10 /usr/bin/arm-linux-gnueabi-g++
        sudo ln -sf /usr/bin/arm-linux-gnueabi-gcc-ar-10 /usr/bin/arm-linux-gnueabi-gcc-ar
        sudo ln -sf /usr/bin/arm-linux-gnueabi-gcc-nm-10 /usr/bin/arm-linux-gnueabi-gcc-nm

    - name: Fix Bluetooth includes
      run: |
        find drivers/bluetooth -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i \
          -e 's/<btfm_slim\.h>/"btfm_slim.h"/g' \
          -e 's/<btfm_slim_wcn3990\.h>/"btfm_slim_wcn3990.h"/g' \
          -e 's/<btfm_slim_codec\.h>/"btfm_slim_codec.h"/g' {} +

    - name: Integrate KernelSU-Next (legacy) and apply manual hooks
      run: |
        rm -rf drivers/staging/kernelsu
        sed -i '/kernelsu/d' drivers/staging/Kconfig
        sed -i '/kernelsu/d' drivers/staging/Makefile
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

        # Recreate the manual hooks patch script
        cat > patch_ksu_next.py << 'PYEOF'
import sys
def patch_file(filepath, old_str, new_str):
    try:
        with open(filepath, 'r') as f: content = f.read()
        if old_str in content:
            content = content.replace(old_str, new_str)
            with open(filepath, 'w') as f: f.write(content)
            print(f"Patched {filepath}")
        else: print(f"Could not find context in {filepath}")
    except Exception as e: print(f"Error patching {filepath}: {e}")

# fs/exec.c
patch_file('fs/exec.c', 'int do_execve(struct filename *filename,', '#ifdef CONFIG_KSU\n__attribute__((hot))\nextern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,\n\t\t\t       void *argv, void *envp, int *flags);\n#endif\n\nint do_execve(struct filename *filename,')
patch_file('fs/exec.c', '\treturn do_execveat_common(AT_FDCWD, filename, argv, envp, 0);\n}', '\t#ifdef CONFIG_KSU\n\tksu_handle_execveat((int *)AT_FDCWD, &filename, &argv, &envp, 0);\n\t#endif\n\n\treturn do_execveat_common(AT_FDCWD, filename, argv, envp, 0);\n}')
# fs/open.c
patch_file('fs/open.c', 'SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)', '#ifdef CONFIG_KSU\n__attribute__((hot))\nextern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,\n\t\t\t        int *mode, int *flags);\n#endif\n\nSYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)')
patch_file('fs/open.c', '\tif (mode & ~S_IRWXO)\n\t\treturn -EINVAL;', '\t#ifdef CONFIG_KSU\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n\t#endif\n\n\tif (mode & ~S_IRWXO)\n\t\treturn -EINVAL;')
# fs/read_write.c
patch_file('fs/read_write.c', 'SYSCALL_DEFINE3(read, unsigned int, fd, char __user *, buf, size_t, count)\n{\n\tstruct fd f = fdget_pos(fd);\n\tssize_t ret = -EBADF;\n\n\tif (f.file) {', '#ifdef CONFIG_KSU\nextern bool ksu_vfs_read_hook __read_mostly;\nextern __attribute__((cold)) int ksu_handle_sys_read(unsigned int fd,\n\t\t\t\t\t\t       char __user **buf_ptr, size_t *count_ptr);\n#endif\n\nSYSCALL_DEFINE3(read, unsigned int, fd, char __user *, buf, size_t, count)\n{\n\tstruct fd f = fdget_pos(fd);\n\tssize_t ret = -EBADF;\n\n\t#ifdef CONFIG_KSU\n\tif (unlikely(ksu_vfs_read_hook))\n\t\tksu_handle_sys_read(fd, &buf, &count);\n\t#endif\n\n\tif (f.file) {')
# fs/stat.c
patch_file('fs/stat.c', 'int vfs_fstatat(int dfd, const char __user *filename, struct kstat *stat,', '#ifdef CONFIG_KSU\n__attribute__((hot))\nextern int ksu_handle_stat(int *dfd, const char __user **filename_user,\n\t\t\t   int *flags);\n#endif\n\nint vfs_fstatat(int dfd, const char __user *filename, struct kstat *stat,')
patch_file('fs/stat.c', '\tif ((flag & ~(AT_SYMLINK_NOFOLLOW | AT_NO_AUTOMOUNT |', '\t#ifdef CONFIG_KSU \n\tksu_handle_stat(&dfd, &filename, &flag);\n\t#endif\n\n\tif ((flag & ~(AT_SYMLINK_NOFOLLOW | AT_NO_AUTOMOUNT |')
# kernel/reboot.c
patch_file('kernel/reboot.c', 'SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd, void __user *, arg)', '#ifdef CONFIG_KSU\nextern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n#endif\n\nSYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd, void __user *, arg)')
patch_file('kernel/reboot.c', '\tif (!ns_capable(pid_ns->user_ns, CAP_SYS_BOOT))\n\t\treturn -EPERM;', '\t#ifdef CONFIG_KSU\n\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n\t#endif\n\n\tif (!ns_capable(pid_ns->user_ns, CAP_SYS_BOOT))\n\t\treturn -EPERM;')
PYEOF
        python3 patch_ksu_next.py

    - name: Configure kernel
      run: |
        mkdir -p out
        make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- tissot_defconfig
        ./scripts/config --file out/.config \
          --enable MODULES \
          --enable MODULE_UNLOAD \
          --enable KALLSYMS \
          --enable KALLSYMS_ALL \
          --disable MODVERSIONS \
          --module MEMKERNEL \
          --enable OVERLAY_FS \
          --set-val KSU y
        make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- olddefconfig

        echo "=== FINAL CONFIG CHECK ==="
        grep -E "^CONFIG_KSU=|^CONFIG_KPROBES=|^CONFIG_OVERLAY_FS=|^CONFIG_MEMKERNEL=|^CONFIG_MODULES=|^CONFIG_MODVERSIONS=|^CONFIG_CMDLINE=" out/.config

    - name: Build vmlinux, modules, and Image.gz-dtb
      run: |
        set -o pipefail
        make -j$(nproc) \
          O=out \
          ARCH=arm64 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          KCFLAGS="-Wno-error=implicit-function-declaration -Wno-error=strict-prototypes -Wno-error=incompatible-pointer-types -Wno-error=address-of-packed-member" \
          vmlinux modules Image.gz-dtb 2>&1 | tee kernel_build.log
        ls -la out/arch/arm64/boot/Image.gz-dtb
        ls -la out/drivers/memkernel/*.ko

    - name: Upload kernel image
      uses: actions/upload-artifact@v4
      with:
        name: Image-gz-dtb
        path: out/arch/arm64/boot/Image.gz-dtb
        if-no-files-found: error
        retention-days: 30

    - name: Upload memkernel module
      uses: actions/upload-artifact@v4
      with:
        name: memkernel-module
        path: out/drivers/memkernel/*.ko
        if-no-files-found: error
        retention-days: 30

    - name: Upload build logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: kernel_build.log
        if-no-files-found: warn
        retention-days: 7
